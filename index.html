<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="神庙">
<title>神庙 Web App</title>
<style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}img{max-width:100%}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">
<style>
/* 版面：顶栏切换「香客端 / 管理后台」。香客端是一台手机画面 + 功能对照表；后台是侧栏 + 工作区。
   视觉：白底、中性灰、单一蓝色强调，圆角卡片；状态用圆形 pill，属性用方形 tag。 */
:root{
  --bg:#F6F7F9; --surface:#FFFFFF; --surface2:#F1F3F6; --line:#E3E6EB;
  --ink:#16181D; --ink2:#4A5160; --ink3:#7B8494;
  --accent:#3355D1; --accent-bg:#3355D1; --accent-fg:#FFFFFF; --accent-soft:#EAEEFC;
  --pri-bg:#16181D; --pri-fg:#FFFFFF;
  --good:#17784A; --good-soft:#E2F4EA; --warn:#95590A; --warn-soft:#FCF0D8; --bad:#BE3A31; --bad-soft:#FCE9E6;
  --info:#2D55C9; --info-soft:#E8EEFD; --violet:#6540C2; --violet-soft:#F0EBFC;
  --slate:#3C4558; --slate-soft:#E8EBF1; --amber:#855D00; --amber-soft:#FAEFD0;
  --card:#16181D; --card-fg:#FFFFFF; --card-sub:#B9BFCB; --card-track:#3A3F4A;
  --shade:rgba(15,20,35,.5); --shadow:rgba(20,25,40,.10);
  --s1:#2a78d6; --s2:#eb6834;
  --fu:#D9232B; --fu-fg:#FFFFFF; --fu-sub:#FFF0EE; --fu-gold:#FFE08A; --fu-track:#EE7F84; --fu-ink:#C01C24; --fu-btn:#D9232B; --fu-btn-fg:#FFFFFF;
  --font:"Poppins","Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --display:var(--font);
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1114; --surface:#17191E; --surface2:#21242B; --line:#2D3139;
  --ink:#F2F4F7; --ink2:#B7BDC9; --ink3:#868E9C;
  --accent:#93A9FF; --accent-bg:#4868E0; --accent-fg:#FFFFFF; --accent-soft:#1D2646;
  --pri-bg:#F2F4F7; --pri-fg:#16181D;
  --good:#62C99A; --good-soft:#14301F; --warn:#E5B05A; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1D1A;
  --info:#93A9FF; --info-soft:#1D2646; --violet:#B9A1FF; --violet-soft:#2A2147;
  --slate:#C4CBDA; --slate-soft:#272C37; --amber:#E2BD63; --amber-soft:#33290F;
  --card:#262A33; --card-fg:#FFFFFF; --card-sub:#B9BFCB; --card-track:#454B58;
  --shade:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
  --fu:#7E1D22; --fu-fg:#FFF4E0; --fu-sub:#EBCDB8; --fu-gold:#F3CF7A; --fu-track:#A4474A; --fu-ink:#F3CF7A; --fu-btn:#E7C06A; --fu-btn-fg:#3A2206;
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1114; --surface:#17191E; --surface2:#21242B; --line:#2D3139;
  --ink:#F2F4F7; --ink2:#B7BDC9; --ink3:#868E9C;
  --accent:#93A9FF; --accent-bg:#4868E0; --accent-fg:#FFFFFF; --accent-soft:#1D2646;
  --pri-bg:#F2F4F7; --pri-fg:#16181D;
  --good:#62C99A; --good-soft:#14301F; --warn:#E5B05A; --warn-soft:#33270F; --bad:#F08A80; --bad-soft:#3A1D1A;
  --info:#93A9FF; --info-soft:#1D2646; --violet:#B9A1FF; --violet-soft:#2A2147;
  --slate:#C4CBDA; --slate-soft:#272C37; --amber:#E2BD63; --amber-soft:#33290F;
  --card:#262A33; --card-fg:#FFFFFF; --card-sub:#B9BFCB; --card-track:#454B58;
  --shade:rgba(0,0,0,.6); --shadow:rgba(0,0,0,.4);
  --fu:#7E1D22; --fu-fg:#FFF4E0; --fu-sub:#EBCDB8; --fu-gold:#F3CF7A; --fu-track:#A4474A; --fu-ink:#F3CF7A; --fu-btn:#E7C06A; --fu-btn-fg:#3A2206;
  --s1:#3987e5; --s2:#d95926; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd{margin:0}
h2,h3{font-weight:600;text-wrap:balance;letter-spacing:-.01em}
b{font-weight:600}

/* 顶栏 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-seal{width:34px;height:34px;border-radius:10px;background:var(--pri-bg);color:var(--pri-fg);font-weight:600;font-size:16px;display:grid;place-items:center}
.brand b{font-size:16px}
.demo-chip{font-size:11px;padding:2px 9px;border-radius:99px;background:var(--surface2);color:var(--ink2);font-weight:500}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;font-weight:500;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px var(--shadow)}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-width:0;max-width:100%}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:var(--surface);font-size:11px;font-weight:600;margin-left:4px}

.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}

/* 通用 */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-fg);font-weight:600}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.wa{background:var(--good);border-color:var(--good);color:var(--surface);font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.mute{background:var(--surface2);color:var(--ink2)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.yin{background:var(--slate-soft);color:var(--slate)} .pill.gold{background:var(--amber-soft);color:var(--amber)}
.tag{display:inline-block;font-size:11px;font-weight:500;padding:1px 7px;border-radius:6px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.tag.t-amber{background:var(--amber-soft);color:var(--amber)} .tag.t-slate{background:var(--slate-soft);color:var(--slate)}
.tag.t-info{background:var(--info-soft);color:var(--info)} .tag.t-good{background:var(--good-soft);color:var(--good)}
.tag.t-violet{background:var(--violet-soft);color:var(--violet)} .tag.t-bad{background:var(--bad-soft);color:var(--bad)}
.muted{color:var(--ink3)} .small{font-size:12.5px} .right{text-align:right} .nowrap{white-space:nowrap}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.label{font-size:11.5px;font-weight:500;color:var(--ink3)}

/* 香客端 */
.dev{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:28px;align-items:start}
.phone{background:var(--bg);border:1px solid var(--line);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;height:min(800px,calc(100dvh - 110px));min-height:520px;box-shadow:0 14px 44px var(--shadow)}
.ph-head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 12px;display:flex;align-items:center;gap:10px}
.ph-head .plaque{font-weight:600;font-size:18px}
.ph-head small{display:block;font-size:12px;color:var(--ink3)}
.ph-head .bell{margin-left:auto;position:relative;border:0;background:var(--surface2);color:var(--ink);border-radius:10px;padding:6px 12px;font-size:12.5px;font-weight:500}
.ph-head .bell i{position:absolute;top:-3px;right:-3px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}
.ph-body{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.ph-body>*{flex:none}
.ph-tabs{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line)}
.ph-tabs button{border:0;background:transparent;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink3)}
.ph-tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.ph-tabs svg,.qi svg,.pimg svg{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ph-tabs svg{width:22px;height:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{font-size:15px;margin-bottom:6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.sec-h h3{font-size:15.5px}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:0;font-size:12.5px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:8px 0 6px}
.meter i{height:6px;border-radius:4px;background:var(--surface2)}
.meter[data-l="1"] i:nth-child(-n+1){background:var(--good)}
.meter[data-l="2"] i:nth-child(-n+2){background:var(--warn)}
.meter[data-l="3"] i{background:var(--bad)}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick button{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 6px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font-size:12px;color:var(--ink2)}
.qi{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.qi svg{width:19px;height:19px}
.alert{border-radius:var(--r);padding:12px 14px;background:var(--warn-soft);color:var(--ink);display:flex;gap:10px;align-items:flex-start}
.alert b{color:var(--warn)}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 16px;text-align:center}
.ticket.now{background:var(--accent-soft);border-color:var(--accent)}
.ticket .small{color:var(--ink3)}
.ticket .no{font-weight:600;font-size:52px;line-height:1.15;color:var(--accent);letter-spacing:.02em}
.ticket dl{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.ticket dt{font-size:11.5px;color:var(--ink3)} .ticket dd{font-weight:600;font-size:16px}
.qcard{display:flex;gap:12px;align-items:center}
.qcard .now{font-weight:600;font-size:24px;line-height:1.1}
.realm{font-size:11px;font-weight:500;padding:2px 8px;border-radius:6px}
.realm.t{background:var(--amber-soft);color:var(--amber)} .realm.y{background:var(--slate-soft);color:var(--slate)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 13px;font-size:13px;color:var(--ink2)}
.chips button[aria-pressed="true"]{background:var(--pri-bg);border-color:var(--pri-bg);color:var(--pri-fg);font-weight:500}
.chips.sub button{padding:3px 11px;font-size:12px;border-radius:8px}
.chips.sub button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.filters{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0;padding-bottom:2px} .item:first-child{padding-top:2px}
.item .price{font-weight:600;white-space:nowrap}
.item p{color:var(--ink2);font-size:12.5px}
.qty{display:inline-flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:9px;border:1px solid var(--line);background:var(--surface);line-height:1;font-weight:600}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pimg{position:relative;aspect-ratio:4/3;display:grid;place-items:center;background:var(--surface2);color:var(--ink3)}
.pimg svg{width:34px;height:34px}
.pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pimg.c-goods,.pimg.c-lamp{background:var(--amber-soft);color:var(--amber)}
.pimg.c-ritual,.pimg.c-more{background:var(--info-soft);color:var(--info)}
.pimg.c-yin,.pimg.c-funeral{background:var(--slate-soft);color:var(--slate)}
.pimg.c-joss{background:var(--violet-soft);color:var(--violet)}
.pimg.c-health{background:var(--good-soft);color:var(--good)}
.plabel{position:absolute;top:8px;left:8px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;background:var(--surface);color:var(--ink)}
.plabel.l-hot{background:var(--bad);color:var(--surface)} .plabel.l-new{background:var(--accent-bg);color:var(--accent-fg)}
.plabel.l-ltd{background:var(--pri-bg);color:var(--pri-fg)}
.pbody{padding:10px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.pname{font-size:13.5px;line-height:1.35}
.pdesc{font-size:12px;color:var(--ink3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptags{display:flex;flex-wrap:wrap;gap:4px}
.pfoot{margin-top:auto;padding-top:4px;display:flex;flex-direction:column;gap:7px}
.pfoot .price{font-weight:600;font-size:15px} .pfoot .price small{font-weight:400;font-size:11.5px;color:var(--ink3)}
.pfoot .btn{width:100%}
.pfoot .qty{justify-content:space-between;background:var(--surface2);border-radius:10px;padding:3px}
.pfoot .qty button{border:0;background:var(--surface)}
.cartbar{background:var(--pri-bg);color:var(--pri-fg);padding:10px 14px;display:flex;align-items:center;gap:10px;font-size:13px}
.cartbar button{margin-left:auto;border:0;border-radius:9px;background:var(--pri-fg);color:var(--pri-bg);font-weight:600;padding:6px 13px}
.mcard{background:var(--fu);color:var(--fu-fg);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px}
.mcard .sub{color:var(--fu-sub)}
.mname{font-size:18px;font-weight:600}
.mseal{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--fu-gold);color:var(--fu-gold);display:grid;place-items:center;font-weight:600;font-size:18px}
.mstats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcard .pts{font-weight:600;font-size:32px;line-height:1.2;color:var(--fu-gold)}
.bar{height:6px;border-radius:4px;background:var(--fu-track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--fu-gold);border-radius:4px}
.btn.fu{background:var(--fu-btn);border-color:var(--fu-btn);color:var(--fu-btn-fg);font-weight:600}
.fucard h3{color:var(--fu-ink)}
.foot{max-width:1280px;margin:0 auto;padding:0 16px 32px;color:var(--ink3);font-size:12.5px}
.ev{display:flex;gap:12px;align-items:flex-start}
.ev .d{flex:none;width:50px;text-align:center;border-radius:11px;overflow:hidden;background:var(--surface2)}
.ev .d b{display:block;font-size:18px;line-height:1.5}
.ev .d span{display:block;font-size:10.5px;color:var(--ink3);padding:0 0 4px}
.field{display:flex;flex-direction:column;gap:4px;border:0;padding:0;margin:0;min-width:0} .field>span,.field>legend{font-size:12px;color:var(--ink2);font-weight:500;padding:0}
.field>legend{margin-bottom:4px}
.radio{display:flex;gap:6px;flex-wrap:wrap}
.radio label{position:relative;border:1px solid var(--line);border-radius:10px;padding:6px 11px;background:var(--surface);cursor:pointer;font-size:13px}
.radio input{position:absolute;opacity:0}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:500}
.radio label:has(input:focus-visible){outline:2px solid var(--accent)}
.sum{display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.sum .tot{font-weight:600;font-size:16px;border-top:1px solid var(--line);padding-top:6px;margin-top:2px}
.bignum{font-weight:600;font-size:32px;line-height:1.2}

.map h2{font-size:21px;margin-bottom:4px}
.map ol{list-style:none;padding:0;margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.map li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.map li b{font-size:13.5px}
.map li p{font-size:12.5px;color:var(--ink2);flex:1}
.map .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--surface2);color:var(--ink2);font-size:11.5px;font-weight:600;margin-right:8px}

/* 后台 */
.adm{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;align-items:start}
.nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
.nav button{border:0;background:transparent;text-align:left;padding:8px 12px;border-radius:10px;color:var(--ink2);font-weight:500}
.nav button:hover{background:var(--surface2)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:11px;font-weight:500;color:var(--ink3);padding:12px 12px 4px}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.ph{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.ph h2{font-size:22px} .ph p{color:var(--ink2);max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.tile .v{font-weight:600;font-size:24px;line-height:1.3}
.tile .v.neg{color:var(--bad)} .tile .v.pos{color:var(--good)}
.tile .k{font-size:12.5px;color:var(--ink2)} .tile .s{font-size:12px;color:var(--ink3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel>h3{font-size:15.5px;margin-bottom:10px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11.5px;color:var(--ink3);text-align:left;font-weight:500;background:var(--surface2);white-space:nowrap}
th,td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tfoot td{font-weight:600;background:var(--surface2)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}

let toastT;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}
const dlP=(()=>{try{return window.claude&&window.claude.use?window.claude.use('downloads'):Promise.resolve(null)}catch(e){return Promise.resolve(null)}})();
function toCSV(rows){return '﻿'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n')}
async function saveFile(filename,text){
 let dl=null;try{dl=await dlP}catch(e){}
 if(dl){try{await dl.save({filename,data:text});toast('已下载 '+filename)}catch(e){if(e&&e.code==='declined')toast('已取消下载');else showCSV(filename,text)}}
 else if(!window.claude){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/octet-stream'}));a.download=filename;document.body.appendChild(a);a.click();a.remove();toast('已下载 '+filename)}catch(e){showCSV(filename,text)}}
 else showCSV(filename,text);
}
async function download(filename,rows,label){
 if(!can('export')){toast('你的职位没有「下载报告」权限');return}
 log('下载',label,`${filename}（${rows.length-1} 笔）`);
 await saveFile(filename,toCSV(rows));render();
}
function showCSV(filename,text){
 const m=document.getElementById('modal');
 m.innerHTML=`<div role="dialog" aria-label="档案内容"><h3>${esc(filename)}</h3><p class="small muted">这个画面不能直接存档，内容可以复制后贴进 Excel 或记事本。</p><textarea id="csvbox" readonly>${esc(text.replace(/^﻿/,''))}</textarea><div class="row"><button class="btn pri" data-act="copycsv">复制内容</button><button class="btn" data-act="closemodal">关闭</button></div></div>`;
 m.hidden=false;
}
function waiting(q){return S.tickets.filter(t=>t.q===q&&t.status==='waiting')}
function serving(q){return S.tickets.find(t=>t.q===q&&t.status==='serving')}
function crowd(){const n=waiting('A').length+waiting('B').length;return n<10?{l:1,t:'宽松',c:'good',n}:n<=25?{l:2,t:'普通',c:'warn',n}:{l:3,t:'拥挤',c:'bad',n}}
function myAhead(){const d=dv();if(!d||!d.ticket)return null;const t=S.tickets.find(x=>x.no===d.ticket);if(!t)return null;const w=waiting(t.q),i=w.findIndex(x=>x.no===t.no),q=S.queues[t.q];return{t,q,ahead:i<0?0:i,eta:i<0?0:(i+1)*q.avg,status:t.status}}
function callNext(q){
 const cur=serving(q);
 if(cur){cur.status='done';const m=TODAY.slice(0,7);S.helped[m]=(S.helped[m]||0)+1;
  const d=cur.did&&S.devotees.find(x=>x.id===cur.did);if(d){d.points+=10;d.credit+=10;d.asks.unshift({d:TODAY,deity:S.queues[q].deity,topic:cur.topic})}}
 const nx=waiting(q)[0];if(nx)nx.status='serving';
 log('叫号',S.queues[q].altar,nx?'叫号 '+nx.no:'队伍已清空');return nx;
}

function waBtn(){return S.cfg.wa?`<a class="btn wa grow" href="${esc(S.cfg.wa)}" target="_blank" rel="noopener" style="text-align:center;text-decoration:none">加入 WhatsApp 社群</a>`:`<button class="btn wa grow" data-act="washeet">加入 WhatsApp 社群</button>`}

function deco(p){
 const HOT=['光明灯（一年）','初一十五拜拜配套','补财库','平安符（已过炉）','收惊'],NEW=['全家福灯（一年）','本庙纪念 T 恤','每月神料订阅（初一＋十五）'],LTD=['神明金身（8 寸）','神诞宴会赞助一桌'];
 p.label=p.label||(HOT.includes(p.name)?'热卖':NEW.includes(p.name)?'新品':LTD.includes(p.name)?'限量':'');
 const t=[];
 if(p.cat==='yin')t.push('阴神坛');else if(p.cat==='ritual'||p.cat==='lamp')t.push('天神坛');
 if(['goods','joss','health'].includes(p.cat))t.push('实物');
 if(p.from)t.push('到府服务');else if(p.cat==='ritual'||p.cat==='yin')t.push('在庙办理');
 if(p.sub)t.push('订阅');
 if(p.cat==='lamp')t.push('一年有效');
 if(p.cat==='joss')t.push('A 区免运');
 if(p.cat==='funeral')t.push('富贵集团');
 if(p.cat==='more'&&!p.from)t.push('预约制');
 if(p.cat==='ritual')t.push(p.from?'陈师傅主理':'黄师傅主理');
 if(p.cat==='yin')t.push('陈师傅主理');
 p.tags=t;return p;
}

function barChart(series,labels,h=190,fmt=rm){
 const W=640,pl=44,pb=22,pt=8,pr=4,max=Math.max(1,...series.flatMap(s=>s.data));
 const step=Math.pow(10,Math.floor(Math.log10(max)));const top=Math.ceil(max/step)*step;const ticks=[0,top/2,top];
 const iw=(W-pl-pr)/labels.length,y=v=>pt+(h-pt-pb)*(1-v/top);const n=series.length,bw=Math.min(18,(iw-10-(n-1)*2)/n);
 let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t>=1000?t/1000+'k':t}</text>`).join('');
 labels.forEach((l,i)=>{const x0=pl+i*iw+(iw-(n*bw+(n-1)*2))/2;
  series.forEach((s,j)=>{const v=s.data[i],yy=y(v),hh=y(0)-yy,x=x0+j*(bw+2),r=Math.min(3,hh);
   g+=`<path d="M${x},${y(0)}V${yy+r}q0,-${r} ${r},-${r}h${bw-2*r}q${r},0 ${r},${r}V${y(0)}z" fill="${s.color}"/>`});
  g+=`<text x="${pl+i*iw+iw/2}" y="${h-6}" text-anchor="middle">${l}</text>`;
  g+=`<rect class="hit" x="${pl+i*iw}" y="${pt}" width="${iw}" height="${h-pt-pb}" data-tip="${esc(l+'｜'+series.map(s=>s.name+' '+fmt(s.data[i])).join('｜'))}"/>`});
 return `${n>1?`<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${s.name}</span>`).join('')}</div>`:''}<div class="chart"><div class="chart-sc"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(series.map(s=>s.name).join('与'))}按月柱状图">${g}</svg></div></div>`;
}

function fin(){

 S.tx.forEach(t=>{if(t.date.slice(0,4)!==y)return;const i=Number(t.date.slice(5,7))-1;if(i<0||i>=n)return;
  if(t.type==='in'){inc[i]+=t.amount;ic[t.cat]=(ic[t.cat]||0)+t.amount}else{exp[i]+=t.amount;ec[t.cat]=(ec[t.cat]||0)+t.amount}});

 return{y,months,inc,exp,ic,ec,ti,te,net,profit:ti-te,lossSum:-sum(lossM),lossN:lossM.length,profSum:sum(profM),profN:profM.length};
}

  else if(k==='sponsor')row=[...v,'未付','',''];
  else{row=[...v,me().name,`PV-${y}-${String(++S.seq.pv).padStart(3,'0')}`];addTx('out',v[2],v[3],v[1])}
  L.rows.unshift(row);S.lForm=false;log('新增','财务表 · '+L.name,row.slice(0,4).join(' · '));toast('已保存')}
 if(f==='adduser'){const u={uid:'U'+String(S.users.length+1).padStart(3,'0'),name:$('us-name'),role:$('us-role'),pin:'1234',phone:''};S.users.push(u);S.userForm=false;log('新增','账号',`${u.name}（${u.role}）`);toast(`已新增 ${u.name}，预设 PIN 1234，请到系统设置更改`)}
 if(f==='rename'){const u=S.users.find(x=>x.uid===e.target.dataset.v),nv=$('rn-name');if(nv&&nv!==u.name){const old=u.name;log('修改','个人资料 · '+u.uid,`姓名 ${old} → ${nv}`);u.name=nv;toast(`已改名。之前的操作记录仍显示「${old}」`)}S.renaming=null}
 render();
});
/* 另一个分页改了资料，这里马上跟着更新 */
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){loadData();validateAuth();render(true)}});
/* 图表提示 */
let tipEl;
document.addEventListener('mousemove',e=>{
 const r=e.target.closest&&e.target.closest('.hit');
 if(!r){if(tipEl){tipEl.remove();tipEl=null}return}
 const box=r.closest('.chart');if(!tipEl||tipEl.parentNode!==box){if(tipEl)tipEl.remove();tipEl=document.createElement('div');tipEl.className='tip';box.appendChild(tipEl)}
 tipEl.innerHTML=r.dataset.tip.split('｜').map(esc).join('<br>');
 const b=box.getBoundingClientRect();tipEl.style.left=Math.min(b.width-70,Math.max(70,e.clientX-b.left))+'px';tipEl.style.top=(e.clientY-b.top-10)+'px';
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('modal').hidden=true});
const INIT=JSON.stringify(S);load();applyTheme();render();
</script>
